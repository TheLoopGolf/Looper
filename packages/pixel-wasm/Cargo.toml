[package]
name = "canvas-pixel"
version = "0.1.0"
edition = "2021"
description = "Deterministic pixel kernels for Canvas AI (WASM in the browser, native via Tauri)."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
